name: Atom65 validation

on:
  push:
    branches: [atom65]
  pull_request:
    branches: [atom65]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: python -m pip install trimesh numpy pillow scipy
      - name: Firmware host tests
        run: |
          for test in tests/host/test_*.py; do python "$test"; done
      - name: Portable updater tests
        run: python -m unittest discover -s tests/tools -v
      - name: Per-profile Decaid driver
        working-directory: integrations/decaid
        run: npm test && npm run build
      - name: Release, source, links, photos and meshes
        run: python tools/atom65/verify_release.py --meshes
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio
      - name: Compile V1.1 GPIO1 configuration
        run: pio run -e atom-v11-gpio1-motor-test -j 2
