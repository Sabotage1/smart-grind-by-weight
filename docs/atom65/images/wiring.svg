<g font-size="18"><text x="340" y="133">1000 µF · ≥10 V</text><text x="340" y="160">Reservoir capacitor</text><text x="365" y="183" fill="#c44136">+</text><text x="455" y="183">−</text><text x="318" y="415" fill="#25885d">active HIGH / LOW off</text><text x="277" y="496" fill="#7e4c3d">leave unconnected</text><text x="592" y="490" fill="#7e4c3d">GPIO18 = touch only</text><text x="590" y="513">Onboard display CS = 46</text><text x="870" y="439">same ground net</text><text x="1085" y="725">Shield → GND</text></g>
