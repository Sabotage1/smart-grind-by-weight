<g stroke-width="5"><path d="M1114 530V655" stroke="#c44136"/><path d="M1173 530V655" stroke="#263c35"/><path d="M1227 530V655" stroke="#25885d"/><path d="M1286 530V655" stroke="#929c98"/></g>
<g font-size="17"><text x="1095" y="565" fill="#c44136">red</text><text x="1150" y="595">black</text><text x="1205" y="565" fill="#25885d">green</text><text x="1262" y="595">white</text></g>
<text x="40" y="590" font-size="21" font-weight="700">One secure ground junction</text><text x="40" y="623" font-size="20">Atom GND + Waveshare G + HX711 GND + capacitor −.</text><text x="40" y="654" font-size="20">Keep scale cables slack; do not bridge fixed and moving parts.</text><text x="40" y="704" font-size="20" fill="#7e4c3d">Original display output disconnected. No parallel drive on RL.</text><text x="40" y="737" font-size="20" fill="#7e4c3d">Remove mains and USB before wiring. Transformer 9 V AC is not this 5 V rail.</text><text x="40" y="794" font-size="18">Dots are junctions. Crossings without dots do not connect. Verify isolation, supply margin and interface on each actual board.</text>
</g></svg>
