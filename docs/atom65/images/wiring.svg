<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" role="img" aria-labelledby="title desc">
<title id="title">Atom65 V1.1 low-voltage wiring map</title><desc id="desc">Atom J1 plus5V to Waveshare5V, common ground, GPIO1 to RL, GRL unused. HX711 VCC3V3, DOUT3, SCK2, shared ground. Capacitor1000 microfarads across5V and ground. T70 red Eplus, black Eminus, green Aplus, white Aminus.</desc>
<rect width="1400" height="830" fill="#fbfaf6"/>
<g font-family="Arial,sans-serif" fill="#192d27"><text x="40" y="46" font-size="29" font-weight="700">Atom65 · Waveshare V1.1 · GPIO1</text><text x="40" y="78" font-size="18">Low-voltage nets in the owner’s checked build. Diagram is not physical pin order. Read the board labels.</text>
<g fill="#fff" stroke="#b5c5bb" stroke-width="2"><rect x="40" y="190" width="220" height="340" rx="14"/><rect x="550" y="190" width="280" height="340" rx="14"/><rect x="1080" y="190" width="250" height="340" rx="14"/><rect x="325" y="105" width="185" height="88" rx="12"/><rect x="1065" y="655" width="280" height="98" rx="12"/></g>
